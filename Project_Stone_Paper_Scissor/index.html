<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Rock_Paper_Scissor</title>
</head>
<body>
    <nav>
        <div class="navbar">
            Rock Paper Scissors
        </div>
    </nav>
    <main>
        <div class="choices">
            <div class="choice" id="paper">
                <img src="../Project_Stone_Paper_Scissor/images/paper.png" alt="Paper">
            </div>
    
                <div class="choice" id="rock">
                    <img src="../Project_Stone_Paper_Scissor/images/rock.png" alt="Rock">
                </div>
                <div class="choice" id="scissor">
                    <img src="../Project_Stone_Paper_Scissor/images/scissors.png" alt="Scissors">
    
                </div>
        </div>
        
            <div class="scoreboard">
                <div class="score">
                    <p id="userscore">0</p>
                    <p>User</p>
                </div>
                <div class="score">
                    <p id="computerscore">0</p>
                    <p>Comp</p>
                </div>
            </div>
            <div class="resultmsg">
                <p id="result">Play your move</p>
            </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
